[package]
name = "jwksproxy"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net"] }
toml = "1.1"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", default-features = false, features = ["arithmetic", "pkcs8", "std"] }
p521 = { version = "0.13", default-features = false, features = ["arithmetic", "pkcs8", "std"] }
rsa = "0.9"
x509-cert = { version = "0.2", features = ["builder"] }

# Enable SHA-256 algorithm identifiers for X.509 ECDSA signatures.
sha2 = { version = "0.11", features = ["oid"] }
