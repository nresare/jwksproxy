[package]
name = "jwksproxy"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = {  version = "0.10", features = ["sys_rng"] }

base64 = "0.23"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14", default-features = false, features = ["arithmetic", "pkcs8", "std"] }
p521 = { version = "0.14", default-features = false, features = ["arithmetic", "pkcs8", "std"] }
rsa = "0.10.0-rc.19"
x509-cert = { version = "0.3", features = ["builder"] }

# Enable SHA-256 algorithm identifiers for X.509 ECDSA signatures.
sha2 = { version = "0.11", features = ["oid"] }
